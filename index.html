<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AR Navigation Prototype</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <script src="app.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      z-index: 999;
    }
  </style>
</head>
<body>

<div id="status">
  Scan Marker A
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: true;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-assets>
    <a-asset-item id="arrowModel" src="assets/arrow.glb"></a-asset-item>
  </a-assets>

  <!-- CAMERA -->
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- MARKER A -->
  <a-entity id="markerA" mindar-image-target="targetIndex: 0">

    <!-- ARROW -->
    <a-gltf-model
      id="arrow"
      src="#arrowModel"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.3 0.3 0.3"
      animation="property: position; dir: alternate; dur: 800; loop: true; to: 0 0.2 0"
    >
    </a-gltf-model>

  </a-entity>

  <!-- MARKER B -->
  <a-entity id="markerB" mindar-image-target="targetIndex: 1">

    <a-text
      value="DESTINATION REACHED"
      color="green"
      align="center"
      position="0 0.5 0"
      scale="1 1 1"
    >
    </a-text>

  </a-entity>

</a-scene>

</body>
</html>
