<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>MindAR Path Navigation</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      z-index: 999;
    }
  </style>
</head>

<body>

<div id="status">
  Scan Marker A
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiScanning: true;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <!-- CAMERA -->
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- MARKER A -->
  <a-entity
    id="markerA"
    mindar-image-target="targetIndex: 0">
  </a-entity>

  <!-- MARKER B -->
  <a-entity
    id="markerB"
    mindar-image-target="targetIndex: 1">

    <a-text
      value="DESTINATION REACHED"
      color="green"
      align="center"
      position="0 0.5 0"
      scale="1 1 1">
    </a-text>

  </a-entity>

</a-scene>

<script>

window.addEventListener("DOMContentLoaded", () => {

  const scene = document.querySelector("a-scene");

  const markerA = document.querySelector("#markerA");
  const markerB = document.querySelector("#markerB");

  const status = document.querySelector("#status");

  let pathPlaced = false;

  // MARKER A FOUND
  markerA.addEventListener("targetFound", () => {

    if (pathPlaced) return;

    status.innerHTML = "Follow the Path";

    console.log("Marker A Found");

    // Get marker world position
    const startPos = new THREE.Vector3();

    markerA.object3D.getWorldPosition(startPos);

    // CREATE PATH DOTS
    for (let i = 0; i < 10; i++) {

      const dot = document.createElement("a-sphere");

      // PATH POSITION
      dot.setAttribute("position", {
        x: startPos.x,
        y: startPos.y + 0.1,
        z: startPos.z - (i * 0.5)
      });

      // STYLE
      dot.setAttribute("radius", 0.08);
      dot.setAttribute("color", "#00ffff");
      dot.setAttribute("opacity", 0.8);

      // GLOWING EFFECT
      dot.setAttribute("material", {
        emissive: "#00ffff",
        emissiveIntensity: 2
      });

      // FLOAT ANIMATION
      dot.setAttribute("animation", {
        property: "position",
        dir: "alternate",
        dur: 800,
        loop: true,
        to: `${startPos.x} ${startPos.y + 0.2} ${startPos.z - (i * 0.5)}`
      });

      scene.appendChild(dot);

    }

    pathPlaced = true;

  });

  // MARKER B FOUND
  markerB.addEventListener("targetFound", () => {

    status.innerHTML = "Destination Reached";

    console.log("Marker B Found");

  });

});

</script>

</body>
</html>
