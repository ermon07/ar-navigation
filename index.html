<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AR Navigation Path</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      z-index: 999;
      font-family: Arial;
    }
  </style>
</head>

<body>

<div id="status">
  Scan Marker A
</div>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- MARKER A -->
  <a-entity
    id="markerA"
    mindar-image-target="targetIndex: 0">
  </a-entity>

  <!-- MARKER B -->
  <a-entity
    id="markerB"
    mindar-image-target="targetIndex: 1">

    <a-text
      value="DESTINATION REACHED"
      color="lime"
      align="center"
      position="0 0.5 0">
    </a-text>

  </a-entity>

</a-scene>

<script>

window.addEventListener("DOMContentLoaded", () => {

  const scene = document.querySelector("a-scene");

  const markerA = document.querySelector("#markerA");
  const markerB = document.querySelector("#markerB");

  const status = document.querySelector("#status");

  let created = false;

  markerA.addEventListener("targetFound", () => {

    if (created) return;

    status.innerHTML = "Follow the AR Path";

    console.log("Marker A Found");

    const startPos = new THREE.Vector3();

    markerA.object3D.getWorldPosition(startPos);

    // CREATE LARGE PATH
    for (let i = 0; i < 8; i++) {

      const pathNode = document.createElement("a-cylinder");

      // BIG DISTANCE BETWEEN NODES
      const zOffset = -1.5 * i;

      pathNode.setAttribute("position", {
        x: startPos.x,
        y: startPos.y - 0.3,
        z: startPos.z + zOffset
      });

      // FLAT GLOWING DISC
      pathNode.setAttribute("radius", 0.25);
      pathNode.setAttribute("height", 0.03);

      pathNode.setAttribute("color", "#00ffff");

      pathNode.setAttribute("material", {
        emissive: "#00ffff",
        emissiveIntensity: 3,
        opacity: 0.9,
        transparent: true
      });

      // PULSE EFFECT
      pathNode.setAttribute("animation", {
        property: "scale",
        dir: "alternate",
        dur: 700,
        loop: true,
        to: "1.3 1 1.3"
      });

      scene.appendChild(pathNode);

    }

    created = true;

  });

  markerB.addEventListener("targetFound", () => {

    status.innerHTML = "Destination Reached";

    console.log("Marker B Found");

  });

});

</script>

</body>
</html>
