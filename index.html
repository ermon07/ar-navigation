<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AR Navigation</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- A-Frame + AR.js -->
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- UI Overlay -->
<div class="overlay container text-center">
  <h2 class="text-light">📍 AR Indoor Navigation</h2>
  <p id="locationName" class="text-warning">Scanning...</p>
  <p id="directionText" class="text-info">Follow instructions</p>
</div>

<!-- AR Scene -->
<a-scene embedded arjs>

  <!-- Marker 1 -->
  <a-marker type="pattern" url="data/egg.patt"
            id="entranceMarker">
    <a-text value="Entrance" position="0 0.5 0" color="yellow"></a-text>
  </a-marker>

  <!-- Marker 2 -->
  <a-marker type="pattern" url="data/dic.patt"
            id="hallwayMarker">
    <a-text value="Hallway" position="0 0.5 0" color="cyan"></a-text>
  </a-marker>

  <!-- Camera -->
  <a-entity camera></a-entity>

</a-scene>

<script src="script.js"></script>
</body>
</html>
